name: Release

# Create a GitHub Release whenever a version tag (vX.Y.Z) is pushed. The release
# notes are generated automatically from the commits/PRs since the previous tag,
# and include a "Full Changelog" link comparing this version to the last one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          # Append a link to the full curated version history.
          gh release view "$tag" --json body --jq .body > notes.md
          printf '\n\n---\nFull version history: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release edit "$tag" --notes-file notes.md
